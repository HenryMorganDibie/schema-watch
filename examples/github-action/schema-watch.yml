# Schema-Watch contract check.
#
# Copy this to .github/workflows/schema-watch.yml
#
# It needs no Schema-Watch account: the check compares this branch's contract
# against a baseline committed in your repo. Regenerate that baseline whenever
# you intend to change the contract.

name: schema-watch

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # post the report comment
  checks: write # publish the check run you can require in branch protection
  security-events: write # upload SARIF to the Security tab

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Drive traffic through the proxy so there is a contract to compare.
      # Point your app's API base URL at http://localhost:4560 in test config.
      - run: npm test

      - run: npx schema-watch export --out contract.json

      - name: Check the contract
        env:
          # Provided automatically; no secret to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx schema-watch check \
            --contract contract.json \
            --baseline .schema-watch/baseline.json \
            --frontend-src src \
            --sarif schema-watch.sarif

      # Findings then appear in the Security tab beside static-analysis
      # results. Runs even when the check failed, which is when it matters.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: schema-watch.sarif

      # Keep the diff for inspection when the check fails.
      - name: Upload contract
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-watch-contract
          path: contract.json
