# Blocks a PR when the API contract breaks.
#
# Drop this into .github/workflows/ in the repo you want gated, set the
# SCHEMA_WATCH_API_KEY secret (mint one in the dashboard under Team > API keys)
# and the SCHEMA_WATCH_PROJECT_ID variable, then mark "contract-check" as a
# required status check in branch protection.
#
# How it works: your integration tests run against the Schema-Watch proxy
# instead of your API directly, so every response gets captured. `check` then
# sends that contract to the server, which diffs it against the last known
# good one and exits 1 if anything breaking slipped in.

name: API contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Start your API
        run: npm run start:test-api &

      - name: Start the Schema-Watch proxy
        env:
          # Point the proxy at your real API; tests then talk to :4560.
          SCHEMA_WATCH_TARGET: http://localhost:3001
        run: |
          npx schema-watch init --target "$SCHEMA_WATCH_TARGET" || true
          npx schema-watch start &
          npx wait-on http://localhost:4561/api/health

      - name: Run integration tests through the proxy
        env:
          # Whatever env var your test suite uses for the API base URL.
          API_BASE_URL: http://localhost:4560
        run: npm run test:integration

      - name: Check for breaking contract changes
        env:
          SCHEMA_WATCH_SYNC_API_KEY: ${{ secrets.SCHEMA_WATCH_API_KEY }}
          SCHEMA_WATCH_SYNC_PROJECT_ID: ${{ vars.SCHEMA_WATCH_PROJECT_ID }}
          SCHEMA_WATCH_CLOUD_URL: https://api.schema-watch.dev
        # Exits 1 on a breaking change, which fails the job and blocks the PR.
        run: npx schema-watch check
